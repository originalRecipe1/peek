name: Publish release tag

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release-tag
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/yt-dlp-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Read the app release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(sed -nE 's/^\s*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)"
          version_name="$(sed -nE 's/^\s*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)"
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] || [[ ! "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Could not read a safe literal app version" >&2
            exit 1
          fi
          tag="v$version_name"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the release commit
        if: steps.version.outputs.create == 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Create the tag and GitHub release
        if: steps.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$VERSION_NAME" =~ (alpha|beta|rc|experiment) ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Peek $VERSION_NAME" \
            --generate-notes \
            "${release_flags[@]}"
